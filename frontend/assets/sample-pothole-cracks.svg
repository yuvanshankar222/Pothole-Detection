<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="cracksTitle">
  <title id="cracksTitle">Medium Surface Cracking and Edge Pothole</title>
  <defs>
    <radialGradient id="edgeDepression" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141a20"/>
      <stop offset="60%" stop-color="#28323c"/>
      <stop offset="100%" stop-color="#455360"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="#495561"/>

  <!-- Lane Markings -->
  <path d="M0 80 L800 80" stroke="#e0e6ed" stroke-width="6" stroke-dasharray="60 30" opacity="0.8"/>

  <!-- Alligator Cracking Network -->
  <g stroke="#1a2027" stroke-width="2.5" fill="none">
    <path d="M 210 160 L 260 190 L 320 170 L 370 210 L 410 180 L 480 200"/>
    <path d="M 260 190 L 280 250 L 340 260 L 370 210"/>
    <path d="M 340 260 L 390 310 L 450 280 L 480 200"/>
    <path d="M 280 250 L 230 300 L 290 340 L 350 330 L 390 310"/>
    <path d="M 450 280 L 520 310 L 560 260 L 480 200"/>
  </g>

  <!-- Emerging Pothole Center -->
  <ellipse cx="360" cy="240" rx="90" ry="48" fill="url(#edgeDepression)" stroke="#1a2027" stroke-width="4"/>
  <ellipse cx="360" cy="245" rx="55" ry="26" fill="#0f1418"/>

  <!-- Aggregate loose stones -->
  <circle cx="340" cy="250" r="5" fill="#718096"/>
  <circle cx="380" cy="240" r="4" fill="#a0aec0"/>
  <circle cx="395" cy="255" r="6" fill="#4a5568"/>

  <text x="400" y="435" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" opacity="0.85">Medium Severity Alligator Cracking &amp; Pit (Sample 02)</text>
</svg>
